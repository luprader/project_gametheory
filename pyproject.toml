[project]
authors = [
  {name = "Ignazio Spaccavento", email = "example@email.com"},
  {name = "Lukas Prader", email = "prader@student.chalmers.se"},
  {name = "Viggo Forsell", email = "example@email.com"},
  {name = "Wilhelm Friberg", email = "example@email.com"}
]
name = "project-gametheory"
version = "0.1.0"
description = "Team project for ENM140 / FIM784 "Game theory and rationality" 2026 at Chalmers / University of Gothenburg"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.1",
    "nbconvert>=7.17.1",
    "numpy>=2.5.3",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = [
    "pyrefly>=1.2.0",
    "ruff>=0.16.6",
]

[tool.ruff]
line-length = 88
indent-width = 4

[tool.ruff.lint]
extend-select = ["ANN", "A", "COM", "C4", "ICN", "PIE", "SIM", "I", "NPY", "PD", "N", "PERF", "D"]

[tool.pyrefly]
project-includes = ["src"]
bad-assignment = false
bad-return = false
